# Run the test suite in containers:  docker compose -f docker-compose.test.yml run --rm tests
services:
  tests:
    build:
      context: .
      target: builder
    command: ["sh", "-c", "uv sync --frozen && uv run pytest -q"]
    volumes:
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://instaflow:instaflow@postgres-test:5432/postgres
    depends_on:
      postgres-test:
        condition: service_healthy
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instaflow
      POSTGRES_PASSWORD: instaflow
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instaflow"]
      interval: 3s
      timeout: 3s
      retries: 20
